<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Bright: meteo 8937c32 glyphs include Feather Icons, MIT, Copyright (c) 2013-2023 Cole Bemis.
       See LICENSE.txt for the preserved Feather license. Missing ids retain neutral MIT supplements. -->

  <!-- Task status: the shapes differ, so status never relies on color. -->
  <symbol id="icon-status-todo" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
  </symbol>
  <symbol id="icon-status-in-progress" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M6 12a6 6 0 0 0 12 0Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="icon-status-completed" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20Z M8.2 11.8 10.5 14.1 15.8 8.8 17.2 10.2 10.5 16.9 6.8 13.2Z"/>
  </symbol>
  <symbol id="icon-status-cancelled" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20Z M7 11h10v2H7Z"/>
  </symbol>

  <!-- Task row: due time, alert, help, notes, shared, more actions, and the drag handle. -->
  <symbol id="icon-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 2"/>
  </symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 8v5M12 16h.01"/>
  </symbol>
  <symbol id="icon-help" viewBox="0 0 24 24">
    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </symbol>
  <symbol id="icon-note" viewBox="0 0 24 24">
    <path d="M5 4h14v11l-5 5H5Z"/>
    <path d="M14 20v-5h5"/>
  </symbol>
  <symbol id="icon-people" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3"/>
    <path d="M3 20a6 6 0 0 1 12 0"/>
    <path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.2a6 6 0 0 1 3 5.8"/>
  </symbol>
  <symbol id="icon-more" viewBox="0 0 24 24">
    <circle cx="5" cy="12" r="1"/>
    <circle cx="12" cy="12" r="1"/>
    <circle cx="19" cy="12" r="1"/>
  </symbol>
  <symbol id="icon-grip" viewBox="0 0 24 24">
    <circle cx="9" cy="6" r="1"/>
    <circle cx="15" cy="6" r="1"/>
    <circle cx="9" cy="12" r="1"/>
    <circle cx="15" cy="12" r="1"/>
    <circle cx="9" cy="18" r="1"/>
    <circle cx="15" cy="18" r="1"/>
  </symbol>

  <!-- Actions: check, close, back, add, search, and sort. -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12"></polyline>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </symbol>
  <symbol id="icon-back" viewBox="0 0 24 24">
    <path d="m15 18-6-6 6-6"/>
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="16" y1="16" x2="21" y2="21"></line>
  </symbol>
  <symbol id="icon-sort" viewBox="0 0 24 24">
    <path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>
  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24">
    <path d="m6 9 6 6 6-6"/>
  </symbol>

  <!-- Navigation: tasks, lists, recycle bin, and settings. -->
  <symbol id="icon-tasks" viewBox="0 0 24 24">
    <path d="M11 6h9M11 12h9M11 18h9"/>
    <path d="m4 6 1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/>
  </symbol>
  <symbol id="icon-lists" viewBox="0 0 24 24">
    <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>
  </symbol>
  <symbol id="icon-bin" viewBox="0 0 24 24">
    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0 .33-1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </symbol>

  <!-- Account: the person of the user button, shown in local mode. -->
  <symbol id="icon-user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/>
  </symbol>

  <!-- Inbox: the bell of the notification button. -->
  <symbol id="icon-bell" viewBox="0 0 24 24">
    <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15Z"/>
    <path d="M10 21h4"/>
  </symbol>

  <!-- Sync states: one shape per state, so the state never relies on color. -->
  <symbol id="icon-sync-local" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="12" rx="2"/>
    <path d="M8 20h8M12 16v4"/>
  </symbol>
  <symbol id="icon-sync-synced" viewBox="0 0 24 24">
    <path d="M7 19h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 10.06 4.5 4.5 0 0 0 7 19Z"/>
    <path d="m9.5 14.5 2 2 3.5-4"/>
  </symbol>
  <symbol id="icon-sync-syncing" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/>
    <path d="M18 3v3.7h-3.7M6 21v-3.7h3.7"/>
  </symbol>
  <symbol id="icon-sync-offline" viewBox="0 0 24 24">
    <path d="M7 19h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 10.06 4.5 4.5 0 0 0 7 19Z"/>
    <path d="m3 3 18 18"/>
  </symbol>
  <symbol id="icon-sync-sign-in" viewBox="0 0 24 24">
    <circle cx="8" cy="15" r="4"/>
    <path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>
  </symbol>
  <symbol id="icon-sync-error" viewBox="0 0 24 24">
    <path d="M12 4 2.5 20h19Z"/>
    <path d="M12 10v4M12 17h.01"/>
  </symbol>
</svg>
